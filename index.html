<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Step 1 QBank Tracker</title>
    <meta name="description" content="Log UWorld blocks by hand and track pace, accuracy and weak systems for USMLE Step 1." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      // Set theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('s1t:theme') || 'system';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
